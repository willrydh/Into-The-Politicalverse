name: Refresh official election-night data

on:
  workflow_dispatch:
    inputs:
      single_run:
        description: Run one audit instead of the bounded election watch
        type: boolean
        default: false
      watch_minutes:
        description: Watch duration (one minute verifies automatic handoff)
        type: choice
        default: '240'
        options:
          - '240'
          - '1'
  schedule:
    # Early-voting source publishes at 06:00 and 14:00 Swedish summer time.
    - cron: "17 4,12 * 8,9 *"
    # Best-effort five-minute checks during the election and final count.
    - cron: "2-57/5 * 13-30 9 *"
    # Keep checking final protocols and corrections after the intensive count.
    - cron: "17 12 * 10-12 *"

permissions:
  contents: write
  actions: write

concurrency:
  group: politicalverse-official-live-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'willrydh/Into-The-Politicalverse'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Limit scheduled collection to the 2026 election
        id: period
        run: |
          if [ "$(date -u +%Y)" = "2026" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.period.outputs.active == 'true'
        with:
          ref: main
          path: code
      - uses: actions/checkout@v4
        if: steps.period.outputs.active == 'true'
        with:
          ref: live-data
          path: published
      - uses: actions/setup-node@v4
        if: steps.period.outputs.active == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
        if: steps.period.outputs.active == 'true'
        working-directory: code
      - name: Validate signatures, votes, mandates and source versions
        id: collect
        if: steps.period.outputs.active == 'true'
        continue-on-error: true
        working-directory: code
        env:
          SINGLE_RUN: ${{ inputs.single_run || false }}
          WATCH_MINUTES: ${{ inputs.watch_minutes || '240' }}
        run: |
          args=()
          if [ "$SINGLE_RUN" = "true" ]; then args+=(--once); fi
          node scripts/watch-election-live.mjs ../published/election-2026.json "${args[@]}"
      - name: Continue the election watch with fresh main code
        if: always() && !cancelled() && steps.period.outputs.active == 'true' && !inputs.single_run
        working-directory: code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node --input-type=module -e 'import {withinCountingWindow} from "./scripts/watch-election-live.mjs"; process.exit(withinCountingWindow(Date.now()) ? 0 : 1)'; then
            gh workflow run election-live.yml --ref main
          fi
      - name: Keep genuine source failures visible
        if: steps.collect.outcome == 'failure'
        run: exit 1
