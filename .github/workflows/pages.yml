name: Deploy public site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run typecheck:insights
      - run: npm run test:insights
      - run: npm run typecheck:sharing
      - run: npm run test:sharing
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static Next.js site
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify_public:
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/domain-health.yml
