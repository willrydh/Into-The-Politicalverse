name: Refresh official personal votes

on:
  schedule:
    - cron: "41 * * 9 *"
    - cron: "41 5 * 10-12 *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: politicalverse-candidate-data-refresh
  cancel-in-progress: false

jobs:
  period:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - id: window
        run: |
          if [ "$(date -u +%Y)" = "2026" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
  refresh:
    needs: period
    if: needs.period.outputs.active == 'true' && github.repository == 'willrydh/Into-The-Politicalverse'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
    steps:
      - name: Check out the public branch
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh verified candidate counts and status
        run: npm run data:import:candidates:2026
      - name: Stage accepted data only
        id: changes
        shell: bash
        run: |
          git add -- \
            data/normalized/candidate-elections-2026.json.gz \
            data/raw/valmyndigheten-2026/candidate-source-manifest.json \
            data/raw/valmyndigheten-2026/candidates
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate changed generation
        if: steps.changes.outputs.changed == 'true'
        run: npm run data:verify && npm run check
      - name: Commit accepted snapshot
        id: publish
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh verified personal votes for 2026"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pages_build:
    if: needs.refresh.outputs.changed == 'true' && needs.refresh.outputs.commit_sha != ''
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the accepted main snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run typecheck:insights
      - run: npm run test:insights
      - run: npm run typecheck:sharing
      - run: npm run test:sharing
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build the exact accepted snapshot
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  pages_deploy:
    if: needs.pages_build.result == 'success'
    needs:
      - refresh
      - pages_build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the accepted snapshot for the final main check
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.commit_sha }}
          fetch-depth: 1
      - name: Refuse to publish a stale main snapshot
        env:
          EXPECTED_SHA: ${{ needs.refresh.outputs.commit_sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
      - name: Deploy accepted snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify_public:
    needs: pages_deploy
    permissions:
      contents: read
    uses: ./.github/workflows/domain-health.yml
